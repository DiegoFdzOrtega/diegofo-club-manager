; Configuración del ORM estadio_orm
; Las rutas son relativas a la carpeta donde está este fichero.

[conexion]
; Motor compilado (en Windows se añade .exe solo)
motor = motor/estadio.exe
; Carpeta donde se guardan las tablas del club
base_de_datos = datos_club

[orm]
; si = enseñar por pantalla el SQL que genera el ORM
mostrar_sql = si

[club]
; Datos del club que usa la aplicación web (no los usa el ORM)
nombre = Polideportivo Las Acacias
